[project]
name = "pdf-archiver"
version = "0.1.0"
description = "PDF Archiving Bot for Stock Reports"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9.0",
    "aiohttp-socks>=0.8.0",
    "asyncpg>=0.29.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
python_files = ["tests/test_*.py"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
